<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Baseball Duck</title>

    <script src="https://unpkg.com/jspsych@8.0.0"></script>
    <link href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" rel="stylesheet" type="text/css" />
    <!-- OSF upload no longer uses @jspsych-contrib/plugin-pipe: its 0.6.0
         release gzip-compresses uploads, which Safari 16.4-16.x corrupts above
         ~35 KB, and its request has no timeout. uploadToDataPipe() below talks
         to the same DataPipe API directly, uncompressed, with a time limit. -->

    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-video-button-response@2.1.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>

    <script src="config/functions.js"></script>
    <script src="trials/custom_plugins.js"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="orientation-lock">
        <div>
            <div style="font-size:60px; margin-bottom:20px;">&#8635;</div>
            Please rotate the device to landscape to continue.
        </div>
    </div>
</body>
<script>

// ============================================================
// DIAGNOSTICS + DATA SAVING (shared by the session and the startup form's
// recovery panel)
// ============================================================

// Any uncaught JS error / rejected promise is kept here and written into the
// data (js_errors column) at save time, so a failed iPad session leaves a trace.
window._jsErrors = [];
function recordJsError(msg) {
    if (window._jsErrors.length < 20) window._jsErrors.push(String(msg).slice(0, 300));
}
window.addEventListener('error', function(e) {
    recordJsError((e.message || 'error') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?'));
});
window.addEventListener('unhandledrejection', function(e) {
    recordJsError('unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

// DataPipe experiment linked to the OSF project (https://pipe.jspsych.org).
const PIPE_EXPERIMENT_ID = '4fzLV6jNJmjL';
const PIPE_URL = 'https://pipe.jspsych.org/api/data/';
const UPLOAD_TIME_LIMIT_MS = 20000;  // total, including the one retry

// Temporary per-session backup in this browser's localStorage, so a Safari
// tab reload mid-session doesn't lose the data. Written after every trial,
// removed once the OSF upload succeeds; otherwise the startup form offers it
// for download/upload next time the page is opened.
const BACKUP_PREFIX = 'baseball_duck_backup_';

var jsPsych = initJsPsych({
    on_data_update: function() { writeSessionBackup(false); }
});

// All saved data drops the `stimulus` column: it's each screen's full HTML
// (~80% of the file for function 3), never analyzed, and it pushed function
// 3's upload over Safari's compression bug threshold.
function sessionRows() {
    return jsPsych.data.get().ignore('stimulus').values();
}

function rowsToCsv(rows) {
    if (!rows || rows.length === 0) return '';
    const allKeys = new Set();
    rows.forEach(row => Object.keys(row).forEach(k => allKeys.add(k)));
    const keys = Array.from(allKeys);
    const escape = (val) => {
        if (val === null || val === undefined) return '';
        const s = (typeof val === 'object') ? JSON.stringify(val) : String(val);
        return (s.includes('"') || s.includes(',') || s.includes('\n') || s.includes('\r'))
            ? '"' + s.replace(/"/g, '""') + '"'
            : s;
    };
    return keys.map(escape).join(',') + '\n' +
        rows.map(row => keys.map(k => escape(row[k])).join(',')).join('\n');
}

// One POST to DataPipe, uncompressed, aborted after timeoutMs.
// Resolves {kind:'response', httpStatus, json} or {kind:'timeout'|'network_error', message}.
function postToDataPipe(filename, csv, timeoutMs) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer;
    var timeout = new Promise(function(resolve) {
        timer = setTimeout(function() {
            if (ctrl) ctrl.abort();
            resolve({ kind: 'timeout', message: 'No reply from DataPipe within ' + Math.round(timeoutMs / 1000) + ' s' });
        }, timeoutMs);
    });
    var request = fetch(PIPE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': '*/*' },
        body: JSON.stringify({ experimentID: PIPE_EXPERIMENT_ID, filename: filename, data: csv }),
        signal: ctrl ? ctrl.signal : undefined
    }).then(function(res) {
        return res.json()
            .catch(function() { return { error: 'HTTP_' + res.status }; })
            .then(function(json) { return { kind: 'response', httpStatus: res.status, json: json }; });
    }).catch(function(err) {
        return { kind: 'network_error', message: (err && err.message) || String(err) };
    });
    return Promise.race([request, timeout]).then(function(r) { clearTimeout(timer); return r; });
}

// Upload with one retry (only when there was no reply at all), capped at
// UPLOAD_TIME_LIMIT_MS overall. Always resolves, never rejects:
// {ok, status, message, attempts}. 201 = saved to OSF; 202 = DataPipe has the
// data and will finish the OSF upload itself; FILE_EXISTS means an earlier
// attempt already got through.
function uploadToDataPipe(filename, csv) {
    var started = Date.now();
    function interpret(r, attempt) {
        if (r.kind !== 'response') {
            return { ok: false, status: r.kind, message: r.message, attempts: attempt };
        }
        var err = r.json && r.json.error;
        if (!err && (r.httpStatus === 201 || r.httpStatus === 202 || r.httpStatus === 200)) {
            return { ok: true, status: r.httpStatus === 202 ? 'queued' : 'saved',
                     message: (r.json && r.json.message) || 'Success', attempts: attempt };
        }
        // Subject IDs are random, so a name clash means an earlier attempt
        // (one that timed out on our side, or an earlier retry) got through.
        if (err === 'FILE_EXISTS') {
            return { ok: true, status: 'already_on_osf', message: 'This file is already on OSF', attempts: attempt };
        }
        return { ok: false, status: err || ('HTTP_' + r.httpStatus),
                 message: (r.json && r.json.message) || '', attempts: attempt };
    }
    return postToDataPipe(filename, csv, UPLOAD_TIME_LIMIT_MS / 2).then(function(r1) {
        var first = interpret(r1, 1);
        var remaining = UPLOAD_TIME_LIMIT_MS - (Date.now() - started);
        if (first.ok || r1.kind === 'response' || remaining < 3000) return first;
        return postToDataPipe(filename, csv, remaining).then(function(r2) { return interpret(r2, 2); });
    });
}

// Local CSV download. Must be called from a tap/click handler: iPad Safari
// blocks or prompts on script-initiated downloads. The blob URL is kept alive
// for 60 s -- revoking it right away (as before, 100 ms) makes Safari fail the
// download with "WebKitBlobResource error 1" if its download prompt is still open.
function downloadCSV(rows, filename) {
    if (!rows || rows.length === 0) { console.warn('No data to save'); return false; }
    const blob = new Blob([rowsToCsv(rows)], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 60000);
    return true;
}

// ---- localStorage session backup ----
window._session = null;  // {subject_id, pid, age, fnNum, filename, uploaded}

function writeSessionBackup(complete) {
    var s = window._session;
    if (!s || s.uploaded) return;
    try {
        var prev = JSON.parse(localStorage.getItem(BACKUP_PREFIX + s.subject_id) || 'null');
        localStorage.setItem(BACKUP_PREFIX + s.subject_id, JSON.stringify({
            subject_id: s.subject_id, pid: s.pid, age: s.age, fnNum: s.fnNum,
            complete: !!(complete || (prev && prev.complete)),
            saved_at: new Date().toISOString(),
            rows: sessionRows()
        }));
    } catch (e) { /* private mode / storage full -- backup is best-effort */ }
}
function clearSessionBackup(subjectId) {
    try { localStorage.removeItem(BACKUP_PREFIX + subjectId); } catch (e) {}
}
function listSessionBackups() {
    var out = [];
    try {
        for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key && key.indexOf(BACKUP_PREFIX) === 0) {
                var b = JSON.parse(localStorage.getItem(key) || 'null');
                if (b && b.rows) out.push(b);
            }
        }
    } catch (e) {}
    return out.sort(function(a, b) { return a.saved_at < b.saved_at ? 1 : -1; });
}
function backupFilename(b) {
    return b.subject_id + (b.complete ? '' : '_partial') + '.csv';
}

const FUNCTION_BY_NUMBER = {
    1: 'positive_linear',
    2: 'negative_linear',
    3: 'quadratic',
    4: 'exponential_growth'
};

// ============================================================
// STAGE GEOMETRY
// All values are % of the .stage box (which is itself locked to the
// 2112x1188 background art's aspect ratio -- see css/styles.css).
// Measured with a pixel-level scan of the actual art (find the gray/white
// pixel bounding boxes), not by eye -- see the PR/commit notes for the
// script. Recalibrate the same way if the art moves again.
// ============================================================
const STAGE_ASPECT = 2112 / 1188; // stage width / height, for width%->height% conversions

const BAR_LEFT   = 1;      // % — left end of the gray slingshot bar (Training_bg.jpeg)
const BAR_RIGHT  = 38.5;   // % — right end of the bar / fork cup (apple & ball rest + launch point)
const BAR_Y      = 44.7;   // % — vertical center of the gray bar

const LINE_LEFT   = 38.9;  // % — left end of the white ground line (0% of duck/output scale)
const LINE_RIGHT  = 92.9;  // % — right end of the white ground line (100% of duck/output scale)
const LINE_Y       = 66.3; // % — vertical center of the white ground line (duck drag height)
const LINE_TOP_Y   = 64.9; // % — top edge of the white ground line (ball rests on TOP of it)
const DUCK_DEFAULT_X = (LINE_LEFT + LINE_RIGHT) / 2;

// Apple's starting position on Intro_1 / Intro_3 (where it sits baked into
// the background, in the fork) — the free apple element in Intro_2 / Intro_4
// starts here and can be dragged left along the bar.
const APPLE_START_X = BAR_RIGHT;
const APPLE_START_Y = BAR_Y;
const APPLE_MIN_X   = 3;
const APPLE_MAX_X   = BAR_RIGHT;

// Ball sprite is rendered at BALL_WIDTH_PCT% of stage WIDTH (see the inline
// width:3% on every <img id="ball-sprite">, kept in sync with this
// constant).
const BALL_WIDTH_PCT  = 3;

// >>> ADJUST THIS ONE NUMBER TO MOVE WHERE THE BALL LANDS VERTICALLY. <<<
// This is the "top" (vertical center, since the ball is anchored by its own
// center) the ball animates to at the end of training_feedback. Starting
// estimate: LINE_TOP_Y minus half the ball's rendered height converted from
// width% to height% via the stage's aspect ratio (a square image's
// on-screen height, as a % of stage HEIGHT, is larger than its width%
// because the stage is wider than it is tall). If the ball still doesn't
// look like it's resting on the track, just change the number directly —
// SMALLER = higher up (further from the bottom edge), LARGER = lower down.
const BALL_LANDING_Y = LINE_TOP_Y - (BALL_WIDTH_PCT * STAGE_ASPECT) / 2 + 3.5;

// ============================================================
// CFL2-QUADRATIC (function 3) GEOMETRY
// Function 3 replaces the straight sliding bar with a slingshot that
// ROTATES around a fixed pivot (its "lower right corner"), sweeping from
// horizontal (0deg, pointing left/west) to vertical (90deg, pointing
// straight down/south) through the lower-left arc drawn (dotted) in
// Intro_5/7/8/9/10/11 and Training_bg_fn3.jpeg. All measured the same way
// as the constants above: pixel-scan the art, fit a circle to the dotted
// arc for the pivot + radius, and locate the apple/bar's own bounding box
// for its rotation anchor. See training_bg_fn3/Intro_5.jpeg if re-measuring.
//
// Angle convention used everywhere below: 0 = bar points left (horizontal),
// 90 = bar points straight down. A point at angle A, distance R from a
// pivot (Px,Py) is at (Px - R*cos(A), Py + R*sin(A)). Because the stage
// isn't square, this trig has to run in actual on-screen PIXELS (via
// getBoundingClientRect()) and get converted back to % afterward --
// doing it directly in % would draw an ellipse instead of a circle.
// ============================================================
const SLING_MIN_ANGLE = 0;
const SLING_MAX_ANGLE = 90;

// -- Familiarization (Fam_3/7/10): apple_slingshot.png, draggable by the child --
const FN3_FAM_PIVOT_X = 38.8;  // % — pivot (fork), Intro_5/6/7/8/9/10/11 share this layout
const FN3_FAM_PIVOT_Y = 42.8;  // %
const FN3_FAM_RADIUS  = 12.4;  // % of stage width — pivot-to-apple distance at rest

// apple_slingshot.png is a 414x124 canvas; its bar's lower-right corner
// (measured at (381,67)px) is the rotation anchor, as a % of the image's
// OWN box -- used as both transform-origin and the translate that pins
// that point to FN3_FAM_PIVOT_X/Y regardless of rendered size (see
// buildRotatingDragTrial).
const APPLE_SLING_ANCHOR_X  = 92.0;  // %
const APPLE_SLING_ANCHOR_Y  = 54.0;  // %
const APPLE_SLING_WIDTH_PCT = 19;  // rendered width, % of stage width (tuned so the anchor-to-apple distance equals FN3_FAM_RADIUS)

// Starting angles matching where apple_slingshot sits baked into
// Intro_5 / Intro_8 / Intro_10 respectively (measured from the apple's
// pixel position relative to the pivot above).
const FAM3_START_ANGLE  = 0;
const FAM7_START_ANGLE  = 19;
const FAM10_START_ANGLE = 43;

// -- Training/testing (Training_bg_fn3.jpeg): separate ball + slingshot elements,
//    NOT draggable -- their angle is set directly from the trial's input value.
//    Only the duck is interactive (reuses LINE_LEFT/RIGHT/Y/TOP_Y above, which
//    measured identically on Training_bg_fn3.jpeg as on Training_bg.jpeg).
const FN3_PIVOT_X = 38.6;  // %
const FN3_PIVOT_Y = 43.2;  // %
const FN3_RADIUS  = 14.0;  // % of stage width

// slingshot.png (plain bar, no apple) is a 370x113 canvas; its bar's
// lower-right corner (measured at (335,74)px) is the rotation anchor.
const SLINGSHOT_ANCHOR_X  = 90.5; // %
const SLINGSHOT_ANCHOR_Y  = 65.5; // %
const SLINGSHOT_WIDTH_PCT = 17.4; // tuned so its radius equals FN3_RADIUS

// >>> ADJUST THIS TO ALIGN THE BALL WITH THE GRAY BAR. <<<
// slingshot.png's rotation anchor (335,74) sits slightly below the bar's
// true centerline at the tip (38,65) -- a pure single-radius point (what
// FN3_RADIUS alone gives you) therefore lands a hair off the bar. This is
// the perpendicular-to-the-bar correction (same "% of stage width" unit as
// FN3_RADIUS), applied in the bar's own rotating frame via arcPoint() so it
// stays correct at every angle, not just one. Starting estimate derived
// from slingshot.png's own pixel measurements: (Δy/|Δx|)*FN3_RADIUS =
// (-9/297)*14.0. NEGATIVE moves the ball toward the bar from below (up, at
// angle=0); POSITIVE moves it further away (down, at angle=0).
const FN3_BALL_PERP_OFFSET = -0.42;

// >>> ADJUST THIS TO CHANGE HOW HIGH THE BALL LOFTS. <<<
// Purely cosmetic (true_output always fixes the final landing X) -- how far
// ABOVE the pivot's height the ball rises mid-flight at a 90deg launch.
// Scales down to 0 as angle -> 0 (a flat shot never rises, same half-parabola
// as the original mechanic); scales up to this full value as angle -> 90.
const FN3_MAX_RISE_PCT = 18;

// input (0-100, from config/functions.js) -> launch angle (0-90deg).
// Simplest reading of "translate input into a percentage then into an
// angle": percentage = input/100, angle = percentage * 90. Since function 3
// (quadratic) is already symmetric/inverted-U shaped in its outputs, this
// linear map alone reproduces the "short at low angle, far near 45deg,
// short-but-high near 90deg" story described in the task spec -- the
// physical realism is in the ANIMATION shape (see buildFn3LandingFeedbackTrial),
// not in re-deriving true_output from the angle (true_output always comes
// straight from functions.js, unchanged).
function inputToAngle(inputValue) {
    return (inputValue / 100) * 90;
}

// Computes the .stage box's on-screen rect WITHOUT touching the DOM, by
// replicating its CSS sizing formula (width: min(100dvw, 100dvh*ASPECT);
// height: min(100dvh, 100dvw/ASPECT); centered via inset:0 + margin:auto).
// arcPoint() needs this from inside a trial's `stimulus` function, which
// jsPsych calls to build the HTML string BEFORE inserting it into the page
// -- at that point .stage doesn't exist in the DOM yet, so
// document.querySelector('.stage').getBoundingClientRect() would throw.
// Computing it from the viewport instead works in every context.
function stageRectFromWindow() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var width  = Math.min(vw, vh * STAGE_ASPECT);
    var height = width / STAGE_ASPECT;
    return { left: (vw - width) / 2, top: (vh - height) / 2, width: width, height: height };
}

// The real on-screen .stage box when it exists, else the window estimate
// above. The estimate uses window.innerWidth/innerHeight while the CSS sizes
// .stage with dvw/dvh -- on iPad Safari those disagree whenever the toolbar
// shows/hides or in Split View, which drifted the fn3 ball/slingshot and
// drag angle. So stimulus functions use the estimate (no stage yet) and
// on_load / drag handlers re-measure against the real box.
function stageRect() {
    var el = document.querySelector('.stage');
    if (el) {
        var r = el.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) return r;
    }
    return stageRectFromWindow();
}

// Computes where a point at `angleDeg` and `radiusPct` (of stage WIDTH) from
// a pivot (in % of stage) actually lands, in real pixels first (so the
// stage's non-square aspect ratio doesn't warp the circle into an ellipse),
// then converted back to %. `perpOffsetPct` (same unit as radiusPct) shifts
// the point PERPENDICULAR to the pivot->point line, in the bar's own
// rotating frame -- i.e. the offset direction turns together with angleDeg,
// so a correction that's right at one angle stays right at every angle.
// Needed because slingshot.png's rotation anchor (its bottom-right corner)
// isn't exactly on the bar's centerline, so a pure single-radius point sits
// slightly off the bar; see FN3_BALL_PERP_OFFSET.
function arcPoint(pivotXPct, pivotYPct, radiusPct, angleDeg, perpOffsetPct) {
    perpOffsetPct = perpOffsetPct || 0;
    var rect = stageRect();
    var pivotXPx = (pivotXPct / 100) * rect.width;
    var pivotYPx = (pivotYPct / 100) * rect.height;
    var radiusPx = (radiusPct / 100) * rect.width;
    var perpPx   = (perpOffsetPct / 100) * rect.width;
    var rad = (angleDeg * Math.PI) / 180;
    var xPx = pivotXPx - radiusPx * Math.cos(rad) + perpPx * Math.sin(rad);
    var yPx = pivotYPx + radiusPx * Math.sin(rad) + perpPx * Math.cos(rad);
    return { xPct: (xPx / rect.width) * 100, yPct: (yPx / rect.height) * 100 };
}

// Inverse of arcPoint: given a pointer's client (viewport) position, returns
// the angle (deg, clamped to [SLING_MIN_ANGLE, SLING_MAX_ANGLE]) from the
// pivot to that position. Used while dragging apple_slingshot.
function angleFromClientPoint(pivotXPct, pivotYPct, clientX, clientY) {
    var rect = stageRect();
    var pivotScreenX = rect.left + (pivotXPct / 100) * rect.width;
    var pivotScreenY = rect.top  + (pivotYPct / 100) * rect.height;
    var dx = clientX - pivotScreenX;
    var dy = clientY - pivotScreenY;
    var angleDeg = (Math.atan2(dy, -dx) * 180) / Math.PI;
    return Math.max(SLING_MIN_ANGLE, Math.min(SLING_MAX_ANGLE, angleDeg));
}

// Renders a rotating sprite (apple_slingshot.png or slingshot.png) pinned by
// its own ANCHOR point (a % of the image's own box, e.g. its lower-right bar
// corner) to a fixed PIVOT point on the stage, at ANGLE degrees. The wrapper
// is positioned at the pivot but sized 100%/100% (of .stage, its own
// containing block) rather than 0/0 -- percentage widths on the <img> child
// resolve against the WRAPPER's width, so a zero-size wrapper would force
// the sprite to render at zero size (invisible) instead of opts.widthPct%
// of the stage. pointer-events:none on the wrapper keeps its now-large
// bounding box from intercepting drags meant for other sprites/buttons;
// the <img> re-enables pointer-events itself via .drag-sprite when draggable.
function rotatingSpriteHtml(opts) {
    return '<div class="pivot-anchor" style="position:absolute; left:' + opts.pivotX + '%; top:' + opts.pivotY + '%; width:100%; height:100%; pointer-events:none;">' +
        '<img id="' + opts.id + '" class="' + (opts.extraClass || '') + '" src="' + opts.src + '" ' +
            'style="position:absolute; left:0; top:0; width:' + opts.widthPct + '%; ' +
            'transform-origin:' + opts.anchorX + '% ' + opts.anchorY + '%; ' +
            'transform: translate(-' + opts.anchorX + '%, -' + opts.anchorY + '%) rotate(' + (-opts.angleDeg) + 'deg); ' +
            'touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-user-drag:none;">' +
        '</div>';
}

// URL query params for quick testing: ?pid=1&age=6&fn=1
document.body.insertAdjacentHTML('beforeend', `
    <div id="startup-form" style="max-width:min(900px, 92vw); margin:24px auto; padding:48px;
                max-height:calc(100dvh - 48px); overflow-y:auto; -webkit-overflow-scrolling:touch; box-sizing:border-box;
                background:white; border-radius:14px;
                box-shadow:0 4px 14px rgba(0,0,0,0.12);

        <h2 style="font-size:30px; margin:0 0 8px;">Baseball Duck — Session Setup</h2>

        <div id="recovery-panel"></div>

        <div style="margin:24px 0;">

                   style="width:100%; padding:18px; font-size:22px; box-sizing:border-box;
                          border:1px solid #ccc; border-radius:8px;">
        </div>

        <div style="margin:24px 0;">
            <label style="display:block; font-weight:bold; font-size:20px; margin-bottom:8px;">Age (years):</label>
            <input type="number" id="age-input" min="3" max="12" step="0.01"
                   style="width:100%; padding:18px; font-size:22px; box-sizing:border-box;
                          border:1px solid #ccc; border-radius:8px;">
        </div>

        <div style="margin:24px 0;">

                   style="width:100%; padding:18px; font-size:22px; box-sizing:border-box;
                          border:1px solid #ccc; border-radius:8px;">

                1 = positive linear, 2 = negative linear, 3 = quadratic, 4 = exponential growth
            </div>
        </div>

        <button id="start-btn"
                style="width:100%; padding:20px; font-size:26px; font-weight:bold;
                       background:#2980b9; color:white; border:none; border-radius:10px;
                       cursor:pointer;">
            Start Session

// ---- Recovery panel: sessions whose OSF upload never succeeded ----
// (tab reloaded mid-session, upload failed/timed out, etc.). Each backup can
// be downloaded, uploaded to OSF (removed on success), or deleted.
function renderRecoveryPanel() {
    var panel = document.getElementById('recovery-panel');
    if (!panel) return;
    var backups = listSessionBackups();
    if (backups.length === 0) { panel.innerHTML = ''; return; }
    var btn = 'padding:10px 14px; font-size:17px; border:none; border-radius:8px; margin:6px 8px 0 0; cursor:pointer;';
    panel.innerHTML =
        '<div style="margin:0 0 24px; padding:20px; border:2px solid #e67e22; border-radius:10px; background:#fff8ef;">' +
        '<div style="font-weight:bold; font-size:20px; margin-bottom:6px;">Unsaved sessions on this device</div>' +
        '<div style="color:#666; font-size:15px; margin-bottom:10px;">These were not uploaded to OSF. Upload or download each one before deleting it.</div>' +
        backups.map(function(b) {
            return '<div style="padding:12px 0; border-top:1px solid #f0d9bf; font-size:17px;" data-subject="' + b.subject_id + '">' +
                '<b>PID ' + String(b.pid).replace(/[<>&"]/g, '') + '</b> · function ' + b.fnNum +
                ' · ' + b.rows.length + ' trials' + (b.complete ? ' (complete)' : ' (incomplete)') +
                ' · ' + new Date(b.saved_at).toLocaleString() +
                '<div class="recovery-status" style="font-size:15px; color:#555; margin-top:4px;"></div>' +
                '<button data-act="upload" style="' + btn + 'background:#27ae60; color:white;">Upload to OSF</button>' +
                '<button data-act="download" style="' + btn + 'background:#2980b9; color:white;">Download CSV</button>' +
                '<button data-act="delete" style="' + btn + 'background:#ddd; color:#333;">Delete</button>' +
            '</div>';
        }).join('') + '</div>';

    panel.querySelectorAll('[data-subject]').forEach(function(row) {
        var b = backups.find(function(x) { return x.subject_id === row.dataset.subject; });
        var status = row.querySelector('.recovery-status');
        row.querySelector('[data-act="download"]').addEventListener('click', function() {
            downloadCSV(b.rows, backupFilename(b));
            status.textContent = 'Download started: ' + backupFilename(b) + ' (check Files › Downloads).';
        });
        row.querySelector('[data-act="upload"]').addEventListener('click', function(e) {
            e.target.disabled = true;
            status.textContent = 'Uploading…';
            uploadToDataPipe(backupFilename(b), rowsToCsv(b.rows)).then(function(res) {
                e.target.disabled = false;
                if (res.ok) {
                    clearSessionBackup(b.subject_id);
                    status.textContent = 'Uploaded to OSF ✓';
                    setTimeout(renderRecoveryPanel, 1500);
                } else {
                    status.textContent = 'Upload failed: ' + res.status + (res.message ? ' – ' + res.message : '');
                }
            });
        });
        var delBtn = row.querySelector('[data-act="delete"]');
        delBtn.addEventListener('click', function() {
            if (delBtn.dataset.armed) {
                clearSessionBackup(b.subject_id);
                renderRecoveryPanel();
            } else {
                delBtn.dataset.armed = '1';
                delBtn.textContent = 'Tap again to delete';
            }
        });
    });
}

// ============================================================
// MAIN EXPERIMENT
// ============================================================
function runExperiment(pid, age, fnNum) {

    var backdrop = document.createElement('div');
    backdrop.style.cssText = 'position:fixed;inset:0;background:#dff0d8;z-index:-1;';
    document.body.appendChild(backdrop);

    var timeline = [];

    const subject_id = jsPsych.randomization.randomID(10);
    const filename = `${subject_id}.csv`;

    jsPsych.data.addProperties({
        subject_id: subject_id, pid: pid, age: age, function_number: fnNum,
        // Device info, to tell iPad sessions from computer ones. iPad Safari
        // reports a Mac user agent by default, so touch_points (>0 on iPad,
        // 0 on a Mac) is the reliable tell.
        user_agent:   navigator.userAgent,
        touch_points: navigator.maxTouchPoints || 0,
        screen_size:  window.screen.width + 'x' + window.screen.height,
        viewport_at_start: window.innerWidth + 'x' + window.innerHeight
    });

    window._session = { subject_id: subject_id, pid: pid, age: age, fnNum: fnNum, filename: filename, uploaded: false };

    // ---- Audio helpers (same pattern as star_farm) ----
    window._activeAudios = [];
    function playAudio(src) {
        var a = new Audio(src);
        window._activeAudios.push(a);
        a.addEventListener('ended', function() {
            window._activeAudios = window._activeAudios.filter(function(x) { return x !== a; });
        });
        a.play().catch(function() {});
        return a;
    }
    function stopAllAudio() {
        window._activeAudios.forEach(function(a) {
            try { a.pause(); a.currentTime = 0; } catch (e) {}
        });
        window._activeAudios = [];
    }

    function positionBtnGrp() {
        var bg = document.getElementById('jspsych-html-button-response-btngroup');
        if (!bg) return;
        var stage = document.querySelector('.stage');
        if (stage && bg.parentElement !== stage) stage.appendChild(bg);
        bg.style.position  = 'absolute';
        bg.style.bottom    = '3%';
        bg.style.right     = '4%';
        bg.style.top       = 'auto';
        bg.style.left      = 'auto';
        bg.style.margin    = '0';
        bg.style.zIndex    = '10';
        bg.style.textAlign = 'right';
    }

    function addBtnSound() {
        var btn = document.querySelector('#jspsych-html-button-response-btngroup [data-choice="0"]');
        if (btn) btn.addEventListener('click', function() {
            stopAllAudio();
            playAudio('assets/audio/button_click.mp3');
        });
    }

    function nextBtnHtml() {
        return '<button class="jspsych-btn stage-btn">' +
               '<img src="assets/images/next_button.png"></button>';
    }

    // Anchors jsPsych's button group inside .stage so it rides with the scene.
    function anchorBtnGroupInStage() {
        var stage  = document.querySelector('.stage');
        var btnGrp = document.getElementById('jspsych-html-button-response-btngroup');
        if (stage && btnGrp && btnGrp.parentElement !== stage) {
            stage.appendChild(btnGrp);
            btnGrp.style.position = 'static';
            btnGrp.style.margin   = '0';
        }
        return btnGrp;
    }

    function stageHtml(bgSrc, extraHtml) {
        return '<div class="stage"><img class="stage-bg" src="' + bgSrc + '">' +
               (extraHtml || '') + '</div>';
    }

    // rAF-driven tween. onUpdate receives progress in [0,1].
    function animate(duration, onUpdate, onComplete) {
        var start = null;
        function frame(ts) {
            if (start === null) start = ts;
            var t = Math.min(1, (ts - start) / duration);
            onUpdate(t);
            if (t < 1) {
                requestAnimationFrame(frame);
            } else if (onComplete) {
                onComplete();
            }
        }
        requestAnimationFrame(frame);
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    // ================================================================
    // buildAudioGatedTrial(opts)
    // Static background + one audio clip. By default a next button stays
    // hidden until the audio finishes (or a 15s fallback fires) and the
    // child taps it to continue. Pass opts.autoAdvance = true to instead
    // advance immediately once the audio ends, with no button shown at all
    // (the button element still exists, hidden, so jsPsych has a response
    // to advance on -- it's just auto-clicked instead of revealed).
    // ================================================================
    function buildAudioGatedTrial(opts) {
        return {
            type: jsPsychHtmlButtonResponse,
            stimulus: stageHtml(opts.background),
            choices: ['next'],
            button_html: function() {
                return '<button id="gated-next-btn" class="jspsych-btn stage-btn" ' +
                       'style="display:none;"><img src="assets/images/next_button.png"></button>';
            },
            data: { task: opts.task },
            on_load: function() {
                anchorBtnGroupInStage();
                var audio = playAudio(opts.audio);

                var revealed = false;
                function revealBtn() {
                    if (revealed) return;
                    revealed = true;
                    var btn = document.getElementById('gated-next-btn') ||
                              document.querySelector('.stage button');
                    if (!btn) return;
                    if (opts.autoAdvance) {
                        btn.click();
                    } else {
                        btn.style.display = 'inline-block';
                        btn.addEventListener('click', function() {
                            playAudio('assets/audio/button_click.mp3');
                        });
                    }
                }
                audio.addEventListener('ended', revealBtn);
                audio.addEventListener('error', revealBtn);
                setTimeout(revealBtn, 15000);
            },
            on_finish: function() { stopAllAudio(); }
        };
    }

    // ================================================================
    // buildVideoTrial(src, task, durationSec)
    // Plays a video full-screen in the stage frame; auto-advances when done.
    // Two fallbacks so a video can never strand the session (there's no
    // button to press): if it hasn't started ~2.5 s in (iPad autoplay blocked,
    // e.g. Low Power Mode), a Play button appears for the experimenter; and
    // the trial ends on its own durationSec + 20 s after it starts regardless.
    // durationSec values are the clips' measured lengths -- update them if a
    // video is replaced with a longer one.
    // ================================================================
    function buildVideoTrial(src, task, durationSec) {
        return {
            type: jsPsychVideoButtonResponse,
            stimulus: [src],
            choices: [],
            trial_ends_after_video: true,
            response_allowed_while_playing: false,
            trial_duration: Math.round((durationSec + 20) * 1000),
            data: { task: task },
            on_load: function() {
                var video = document.getElementById('jspsych-video-button-response-stimulus');
                window._videoTrialInfo = { autoplayBlocked: false, ended: false };
                if (!video) return;
                video.setAttribute('playsinline', '');
                video.addEventListener('ended', function() {
                    if (window._videoTrialInfo) window._videoTrialInfo.ended = true;
                });
                jsPsych.pluginAPI.setTimeout(function() {
                    if (!video.paused || video.ended || video.currentTime > 0.1) return;
                    window._videoTrialInfo.autoplayBlocked = true;
                    var playBtn = document.createElement('button');
                    playBtn.textContent = '▶ Play';
                    playBtn.style.cssText = 'position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); ' +
                        'z-index:1000; padding:24px 48px; font-size:36px; font-weight:bold; border:none; ' +
                        'border-radius:16px; background:#2980b9; color:white;';
                    playBtn.addEventListener('click', function() {
                        video.play().catch(function(e) { recordJsError('video play: ' + e.message); });
                        playBtn.remove();
                    });
                    video.parentElement.appendChild(playBtn);
                }, 2500);
            },
            on_finish: function(data) {
                if (window._videoTrialInfo) {
                    data.video_autoplay_blocked = window._videoTrialInfo.autoplayBlocked;
                    // false = the trial_duration fallback ended it, not the video.
                    data.video_completed = window._videoTrialInfo.ended;
                    window._videoTrialInfo = null;
                }
            }
        };
    }

    // ================================================================
    // buildAppleDragTrial(opts)
    // Familiarization trials (Fam_3, Fam_5, Fam_8, Fam_10): the apple is a
    // free sprite that starts at the same spot it occupies baked into the
    // *_1/_3 background, can be dragged left/right along the gray bar, and
    // stops wherever the pointer/touch is released (re-draggable after).
    // OK appears after the first drag; clicking/tapping it locks the apple
    // and advances. Final position is recorded in trial data.
    // ================================================================
    function buildAppleDragTrial(opts) {
        return {
            type: jsPsychHtmlButtonResponse,
            stimulus: stageHtml(opts.background,
                '<img id="apple-sprite" class="drag-sprite" src="assets/images/apple.png" ' +
                'style="left:' + APPLE_START_X + '%; top:' + APPLE_START_Y + '%; width:4%;">'),
            choices: ['OK'],
            button_html: function() {
                return '<button id="ok-btn" class="jspsych-btn stage-btn" ' +
                       'style="display:none;"><img src="assets/images/ok_button.png"></button>';
            },
            data: { task: opts.task },
            on_load: function() {
                anchorBtnGroupInStage();
                var apple  = document.getElementById('apple-sprite');
                var okBtn  = document.getElementById('ok-btn');

                var hasInteracted = false;
                var currentXPct   = APPLE_START_X;
                var firstMoveTs   = null;
                var startTs       = performance.now();

                function updatePosition(clientX) {
                    var stage = document.querySelector('.stage');
                    var rect  = stage.getBoundingClientRect();
                    var xPct  = ((clientX - rect.left) / rect.width) * 100;
                    xPct = Math.max(APPLE_MIN_X, Math.min(APPLE_MAX_X, xPct));
                    currentXPct = xPct;
                    apple.style.left = xPct + '%';
                    if (!hasInteracted) {
                        hasInteracted = true;
                        firstMoveTs = performance.now() - startTs;
                        okBtn.style.display = 'inline-block';
                    }
                }

                var dragHandlers = attachUnifiedInput(apple, {
                    down: function(e) { e.preventDefault(); updatePosition(e.clientX); },
                    move: function(e) { e.preventDefault(); updatePosition(e.clientX); },
                    up:   function() {}
                });

                okBtn.addEventListener('click', function() {
                    stopAllAudio();
                    playAudio('assets/audio/ok_button_click.mp3');
                    apple.classList.add('is-locked');
                    dragHandlers.destroy();
                });

                window._appleTrialData = {
                    finalPct:    function() { return currentXPct; },
                    interacted:  function() { return hasInteracted; },
                    firstMoveMs: function() { return firstMoveTs ? Math.round(firstMoveTs) : null; }
                };
            },
            on_finish: function(data) {
                stopAllAudio();
                if (window._appleTrialData) {
                    data.apple_final_pct    = window._appleTrialData.finalPct();
                    data.interacted         = window._appleTrialData.interacted();
                    data.first_move_rt_ms   = window._appleTrialData.firstMoveMs();
                    window._appleTrialData  = null;
                }
            }
        };
    }

    // ================================================================
    // buildPlacementTrial(opts)
    // Shared by training (response half) and testing trials: the ball
    // appears static on the gray bar at opts.input_value (% distance from
    // the bar's right/fork end); the duck is a free sprite the child drags
    // left/right along the white ground line to predict where the ball will
    // land. OK appears after the first duck drag; clicking it locks the
    // duck in place. For training, the timeline pushes a companion
    // buildLandingFeedbackTrial right after this one; for testing, nothing
    // follows and there is no feedback / ball flight shown.
    // ================================================================
    function buildPlacementTrial(opts) {
        var ballStartX = BAR_RIGHT - (opts.input_value / 100) * (BAR_RIGHT - BAR_LEFT);

        return {
            type: jsPsychHtmlButtonResponse,
            stimulus: stageHtml(TRAINING_BG,
                '<img id="ball-sprite" class="drag-sprite is-locked" src="assets/images/ball.png" ' +
                    'style="left:' + ballStartX + '%; top:' + BAR_Y + '%; width:3%;">' +
                '<img id="duck-sprite" class="drag-sprite anchor-duck-arrow" src="assets/images/duck.png" ' +
                    'style="left:' + DUCK_DEFAULT_X + '%; top:' + LINE_Y + '%; width:9%;">'),
            choices: ['OK'],
            button_html: function() {
                return '<button id="ok-btn" class="jspsych-btn stage-btn" ' +
                       'style="display:none;"><img src="assets/images/ok_button.png"></button>';
            },
            data: {
                task:            opts.task,
                input_value:     opts.input_value,
                true_output:     opts.true_output !== undefined ? opts.true_output : null,
                trial_index:     opts.trial_index,
                canonical_index: opts.canonical_index !== undefined ? opts.canonical_index : null
            },
            on_load: function() {
                anchorBtnGroupInStage();
                var duck  = document.getElementById('duck-sprite');
                var okBtn = document.getElementById('ok-btn');

                var hasInteracted = false;
                var currentXPct   = DUCK_DEFAULT_X;
                var firstMoveTs   = null;
                var startTs       = performance.now();

                function updatePosition(clientX) {
                    var stage = document.querySelector('.stage');
                    var rect  = stage.getBoundingClientRect();
                    var xPct  = ((clientX - rect.left) / rect.width) * 100;
                    xPct = Math.max(LINE_LEFT, Math.min(LINE_RIGHT, xPct));
                    currentXPct = xPct;
                    duck.style.left = xPct + '%';
                    if (!hasInteracted) {
                        hasInteracted = true;
                        firstMoveTs = performance.now() - startTs;
                        okBtn.style.display = 'inline-block';
                    }
                }

                var dragHandlers = attachUnifiedInput(duck, {
                    down: function(e) { e.preventDefault(); updatePosition(e.clientX); },
                    move: function(e) { e.preventDefault(); updatePosition(e.clientX); },
                    up:   function() {}
                });

                setTimeout(function() { playAudio(opts.place_audio); }, 700);

                okBtn.addEventListener('click', function() {
                    playAudio('assets/audio/ok_button_click.mp3');
                    duck.classList.add('is-locked');
                    dragHandlers.destroy();
                });

                window._placementTrialData = {
                    finalPct:    function() { return currentXPct; },
                    interacted:  function() { return hasInteracted; },
                    firstMoveMs: function() { return firstMoveTs ? Math.round(firstMoveTs) : null; }
                };
            },
            on_finish: function(data) {
                stopAllAudio();
                if (window._placementTrialData) {
                    var responsePct = ((window._placementTrialData.finalPct() - LINE_LEFT) /
                                        (LINE_RIGHT - LINE_LEFT)) * 100;
                    data.response_pct     = responsePct;
                    data.interacted       = window._placementTrialData.interacted();
                    data.first_move_rt_ms = window._placementTrialData.firstMoveMs();
                    window._placementTrialData = null;
                    // Handed to the companion feedback trial (training only).
                    window._lastDuckResponsePct = responsePct;
                }
            }
        };
    }

    // ================================================================
    // buildLandingFeedbackTrial(opts)
    // Training only (no testing counterpart). Redraws the duck frozen at
    // the response just recorded, then animates the ball: it rolls the
    // full length of the gray bar to the fork, then falls in a half
    // parabola (zero initial vertical velocity, so x is linear in time and
    // y grows with t^2 -- true projectile-off-a-ledge motion) to land at
    // opts.true_output on the white ground line. landed_audio plays once
    // it lands; next appears once that finishes.
    // ================================================================
    function buildLandingFeedbackTrial(opts) {
        var ballStartX = BAR_RIGHT - (opts.input_value / 100) * (BAR_RIGHT - BAR_LEFT);
        var landingX   = LINE_LEFT + (opts.true_output / 100) * (LINE_RIGHT - LINE_LEFT);

        return {
            type: jsPsychHtmlButtonResponse,
            // NOTE: must be a plain function, evaluated lazily by jsPsych right
            // before this trial displays -- NOT an IIFE. An IIFE here would run
            // at timeline-build time (inside the training for-loop, before
            // jsPsych.run() starts), when window._lastDuckResponsePct hasn't
            // been set by any trial yet, so the duck would always render at
            // the fallback position instead of the child's actual response.
            stimulus: function() {
                var duckPct = (typeof window._lastDuckResponsePct === 'number')
                              ? window._lastDuckResponsePct : 0;
                var duckX = LINE_LEFT + (duckPct / 100) * (LINE_RIGHT - LINE_LEFT);
                return stageHtml(TRAINING_BG,
                    '<img id="ball-sprite" class="drag-sprite is-locked" src="assets/images/ball.png" ' +
                        'style="left:' + ballStartX + '%; top:' + BAR_Y + '%; width:3%;">' +
                    '<img id="duck-sprite" class="drag-sprite anchor-duck-arrow is-locked" src="assets/images/duck.png" ' +
                        'style="left:' + duckX + '%; top:' + LINE_Y + '%; width:9%;">');
            },
            choices: ['next'],
            button_html: function() {
                return '<button id="landed-next-btn" class="jspsych-btn stage-btn" ' +
                       'style="display:none;"><img src="assets/images/next_button.png"></button>';
            },
            data: {
                task:        'training_feedback',
                input_value: opts.input_value,
                true_output: opts.true_output,
                trial_index: opts.trial_index
            },
            on_load: function() {
                anchorBtnGroupInStage();
                var ball = document.getElementById('ball-sprite');

                setTimeout(function() {
                    // Phase 1: roll along the bar to the fork/launch point.
                    animate(700, function(t) {
                        ball.style.left = lerp(ballStartX, BAR_RIGHT, t) + '%';
                    }, function() {
                        // Phase 2: half parabola down to the landing spot.
                        animate(700, function(t) {
                            ball.style.left = lerp(BAR_RIGHT, landingX, t) + '%';
                            ball.style.top  = lerp(BAR_Y, BALL_LANDING_Y, t * t) + '%';
                        }, function() {
                            setTimeout(function() {
                                var audio = playAudio(opts.landed_audio);
                                window._lastDuckResponsePct = null;

                                var revealed = false;
                                function revealBtn() {
                                    if (revealed) return;
                                    revealed = true;
                                    var btn = document.getElementById('landed-next-btn');
                                    if (btn) {
                                        btn.style.display = 'inline-block';
                                        btn.addEventListener('click', function() {
                                            playAudio('assets/audio/button_click.mp3');
                                        });
                                    }
                                }
                                audio.addEventListener('ended', revealBtn);
                                audio.addEventListener('error', revealBtn);
                                setTimeout(revealBtn, 15000);
                            }, 300);
                        });
                    });
                }, 400);
            },
            on_finish: function() { stopAllAudio(); }
        };
    }


    // ================================================================
    // buildRotatingDragTrial(opts)
    // Function-3 (quadratic) familiarization trials (Fam_3/7/10): apple_slingshot
    // is a free sprite pinned to FN3_FAM_PIVOT_X/Y by its own lower-right bar
    // corner (APPLE_SLING_ANCHOR_X/Y) and rotated by dragging, instead of the
    // original mechanic's straight-line slide. Same OK-appears-after-first-
    // drag / lock-on-click pattern as buildAppleDragTrial.
    // ================================================================
    function buildRotatingDragTrial(opts) {
        return {
            type: jsPsychHtmlButtonResponse,
            stimulus: stageHtml(opts.background, rotatingSpriteHtml({
                id: 'sling-sprite', src: 'assets/images/apple_slingshot.png',
                pivotX: FN3_FAM_PIVOT_X, pivotY: FN3_FAM_PIVOT_Y,
                anchorX: APPLE_SLING_ANCHOR_X, anchorY: APPLE_SLING_ANCHOR_Y,
                widthPct: APPLE_SLING_WIDTH_PCT, angleDeg: opts.startAngle,
                extraClass: 'drag-sprite'
            })),
            choices: ['OK'],
            button_html: function() {
                return '<button id="ok-btn" class="jspsych-btn stage-btn" ' +
                       'style="display:none;"><img src="assets/images/ok_button.png"></button>';
            },
            data: { task: opts.task },
            on_load: function() {
                anchorBtnGroupInStage();
                var sprite = document.getElementById('sling-sprite');
                var okBtn  = document.getElementById('ok-btn');

                var hasInteracted = false;
                var currentAngle  = opts.startAngle;
                var firstMoveTs   = null;
                var startTs       = performance.now();

                function updateAngle(clientX, clientY) {
                    var angle = angleFromClientPoint(FN3_FAM_PIVOT_X, FN3_FAM_PIVOT_Y, clientX, clientY);
                    currentAngle = angle;
                    sprite.style.transform = 'translate(-' + APPLE_SLING_ANCHOR_X + '%, -' +
                        APPLE_SLING_ANCHOR_Y + '%) rotate(' + (-angle) + 'deg)';
                    if (!hasInteracted) {
                        hasInteracted = true;
                        firstMoveTs = performance.now() - startTs;
                        okBtn.style.display = 'inline-block';
                    }
                }

                var dragHandlers = attachUnifiedInput(sprite, {
                    down: function(e) { e.preventDefault(); updateAngle(e.clientX, e.clientY); },
                    move: function(e) { e.preventDefault(); updateAngle(e.clientX, e.clientY); },
                    up:   function() {}
                });

                okBtn.addEventListener('click', function() {
                    stopAllAudio();
                    playAudio('assets/audio/ok_button_click.mp3');
                    sprite.classList.add('is-locked');
                    dragHandlers.destroy();
                });

                window._slingTrialData = {
                    finalAngle:  function() { return currentAngle; },
                    interacted:  function() { return hasInteracted; },
                    firstMoveMs: function() { return firstMoveTs ? Math.round(firstMoveTs) : null; }
                };
            },
            on_finish: function(data) {
                stopAllAudio();
                if (window._slingTrialData) {
                    data.apple_final_angle_deg = window._slingTrialData.finalAngle();
                    data.interacted            = window._slingTrialData.interacted();
                    data.first_move_rt_ms      = window._slingTrialData.firstMoveMs();
                    window._slingTrialData     = null;
                }
            }
        };
    }

    // ================================================================
    // buildFn3PlacementTrial(opts)
    // Function-3 training/testing placement half: ball+slingshot are STATIC
    // this trial, rendered at the angle inputToAngle(opts.input_value) gives
    // (the child does not rotate them -- only the duck is interactive, via
    // the exact same drag mechanic and LINE_LEFT/RIGHT/Y constants as
    // buildPlacementTrial). Kept as its own function rather than folded into
    // buildPlacementTrial to avoid touching the working original mechanic.
    // ================================================================
    function buildFn3PlacementTrial(opts) {
        var angle = inputToAngle(opts.input_value);

        return {
            type: jsPsychHtmlButtonResponse,
            stimulus: function() {
                var ballPos = arcPoint(FN3_PIVOT_X, FN3_PIVOT_Y, FN3_RADIUS, angle, FN3_BALL_PERP_OFFSET);
                return stageHtml(TRAINING_BG_FN3,
                    rotatingSpriteHtml({
                        id: 'fn3-sling-sprite', src: 'assets/images/slingshot.png',
                        pivotX: FN3_PIVOT_X, pivotY: FN3_PIVOT_Y,
                        anchorX: SLINGSHOT_ANCHOR_X, anchorY: SLINGSHOT_ANCHOR_Y,
                        widthPct: SLINGSHOT_WIDTH_PCT, angleDeg: angle
                    }) +
                    '<img id="ball-sprite" class="drag-sprite is-locked" src="assets/images/ball.png" ' +
                        'style="left:' + ballPos.xPct + '%; top:' + ballPos.yPct + '%; width:' + BALL_WIDTH_PCT + '%;">' +
                    '<img id="duck-sprite" class="drag-sprite anchor-duck-arrow" src="assets/images/duck.png" ' +
                        'style="left:' + DUCK_DEFAULT_X + '%; top:' + LINE_Y + '%; width:9%;">'
                );
            },
            choices: ['OK'],
            button_html: function() {
                return '<button id="ok-btn" class="jspsych-btn stage-btn" ' +
                       'style="display:none;"><img src="assets/images/ok_button.png"></button>';
            },
            data: {
                task:            opts.task,
                input_value:     opts.input_value,
                true_output:     opts.true_output !== undefined ? opts.true_output : null,
                trial_index:     opts.trial_index,
                canonical_index: opts.canonical_index !== undefined ? opts.canonical_index : null
            },
            on_load: function() {
                anchorBtnGroupInStage();
                var duck  = document.getElementById('duck-sprite');
                var okBtn = document.getElementById('ok-btn');

                // Re-place the ball against the real .stage box (the stimulus
                // HTML could only use the window-size estimate).
                var ball    = document.getElementById('ball-sprite');
                var ballPos = arcPoint(FN3_PIVOT_X, FN3_PIVOT_Y, FN3_RADIUS, angle, FN3_BALL_PERP_OFFSET);
                ball.style.left = ballPos.xPct + '%';
                ball.style.top  = ballPos.yPct + '%';

                var hasInteracted = false;
                var currentXPct   = DUCK_DEFAULT_X;
                var firstMoveTs   = null;
                var startTs       = performance.now();

                function updatePosition(clientX) {
                    var stage = document.querySelector('.stage');
                    var rect  = stage.getBoundingClientRect();
                    var xPct  = ((clientX - rect.left) / rect.width) * 100;
                    xPct = Math.max(LINE_LEFT, Math.min(LINE_RIGHT, xPct));
                    currentXPct = xPct;
                    duck.style.left = xPct + '%';
                    if (!hasInteracted) {
                        hasInteracted = true;
                        firstMoveTs = performance.now() - startTs;
                        okBtn.style.display = 'inline-block';
                    }
                }

                var dragHandlers = attachUnifiedInput(duck, {
                    down: function(e) { e.preventDefault(); updatePosition(e.clientX); },
                    move: function(e) { e.preventDefault(); updatePosition(e.clientX); },
                    up:   function() {}
                });

                setTimeout(function() { playAudio(opts.place_audio); }, 700);

                okBtn.addEventListener('click', function() {
                    playAudio('assets/audio/ok_button_click.mp3');
                    duck.classList.add('is-locked');
                    dragHandlers.destroy();
                });

                window._placementTrialData = {
                    finalPct:    function() { return currentXPct; },
                    interacted:  function() { return hasInteracted; },
                    firstMoveMs: function() { return firstMoveTs ? Math.round(firstMoveTs) : null; }
                };
            },
            on_finish: function(data) {
                stopAllAudio();
                if (window._placementTrialData) {
                    var responsePct = ((window._placementTrialData.finalPct() - LINE_LEFT) /
                                        (LINE_RIGHT - LINE_LEFT)) * 100;
                    data.response_pct     = responsePct;
                    data.interacted       = window._placementTrialData.interacted();
                    data.first_move_rt_ms = window._placementTrialData.firstMoveMs();
                    window._placementTrialData = null;
                    window._lastDuckResponsePct = responsePct;
                }
            }
        };
    }

    // ================================================================
    // buildFn3LandingFeedbackTrial(opts)
    // Function-3 training feedback: ball rolls inward along the CURRENT bar
    // angle to the pivot (release point), then flies to true_output. Unlike
    // the original mechanic's fixed half-parabola, the flight has a rise
    // phase that scales with sin(angle) -- 0 at angle=0 (reduces to exactly
    // the original half-parabola fall), maximal near angle=90 (high, narrow
    // lob) -- purely a visual shape; the landing X always comes straight
    // from true_output, never from simulating angle-based range.
    // ================================================================
    function buildFn3LandingFeedbackTrial(opts) {
        var angle     = inputToAngle(opts.input_value);
        var landingX  = LINE_LEFT + (opts.true_output / 100) * (LINE_RIGHT - LINE_LEFT);

        return {
            type: jsPsychHtmlButtonResponse,
            stimulus: function() {
                var ballStart = arcPoint(FN3_PIVOT_X, FN3_PIVOT_Y, FN3_RADIUS, angle, FN3_BALL_PERP_OFFSET);
                var duckPct = (typeof window._lastDuckResponsePct === 'number')
                              ? window._lastDuckResponsePct : 0;
                var duckX = LINE_LEFT + (duckPct / 100) * (LINE_RIGHT - LINE_LEFT);
                return stageHtml(TRAINING_BG_FN3,
                    rotatingSpriteHtml({
                        id: 'fn3-sling-sprite', src: 'assets/images/slingshot.png',
                        pivotX: FN3_PIVOT_X, pivotY: FN3_PIVOT_Y,
                        anchorX: SLINGSHOT_ANCHOR_X, anchorY: SLINGSHOT_ANCHOR_Y,
                        widthPct: SLINGSHOT_WIDTH_PCT, angleDeg: angle
                    }) +
                    '<img id="ball-sprite" class="drag-sprite is-locked" src="assets/images/ball.png" ' +
                        'style="left:' + ballStart.xPct + '%; top:' + ballStart.yPct + '%; width:' + BALL_WIDTH_PCT + '%;">' +
                    '<img id="duck-sprite" class="drag-sprite anchor-duck-arrow is-locked" src="assets/images/duck.png" ' +
                        'style="left:' + duckX + '%; top:' + LINE_Y + '%; width:9%;">'
                );
            },
            choices: ['next'],
            button_html: function() {
                return '<button id="landed-next-btn" class="jspsych-btn stage-btn" ' +
                       'style="display:none;"><img src="assets/images/next_button.png"></button>';
            },
            data: {
                task:        'training_feedback',
                input_value: opts.input_value,
                true_output: opts.true_output,
                trial_index: opts.trial_index
            },
            on_load: function() {
                anchorBtnGroupInStage();
                var ball      = document.getElementById('ball-sprite');
                var ballStart = arcPoint(FN3_PIVOT_X, FN3_PIVOT_Y, FN3_RADIUS, angle, FN3_BALL_PERP_OFFSET);
                // Snap to the real-stage position now, not 400 ms later when
                // the roll starts (avoids a visible jump).
                ball.style.left = ballStart.xPct + '%';
                ball.style.top  = ballStart.yPct + '%';

                function revealNext() {
                    setTimeout(function() {
                        var audio = playAudio(opts.landed_audio);
                        window._lastDuckResponsePct = null;

                        var revealed = false;
                        function revealBtn() {
                            if (revealed) return;
                            revealed = true;
                            var btn = document.getElementById('landed-next-btn');
                            if (btn) {
                                btn.style.display = 'inline-block';
                                btn.addEventListener('click', function() {
                                    playAudio('assets/audio/button_click.mp3');
                                });
                            }
                        }
                        audio.addEventListener('ended', revealBtn);
                        audio.addEventListener('error', revealBtn);
                        setTimeout(revealBtn, 15000);
                    }, 300);
                }

                setTimeout(function() {
                    // Phase 0: roll inward along the bar to the pivot/release point.
                    animate(500, function(t) {
                        ball.style.left = lerp(ballStart.xPct, FN3_PIVOT_X, t) + '%';
                        ball.style.top  = lerp(ballStart.yPct, FN3_PIVOT_Y, t) + '%';
                    }, function() {
                        var angleRad     = (angle * Math.PI) / 180;
                        var riseAmount   = FN3_MAX_RISE_PCT * Math.sin(angleRad);
                        var riseDuration = Math.round(600 * (riseAmount / FN3_MAX_RISE_PCT));
                        var fallDuration = 700;
                        var totalDuration = riseDuration + fallDuration;
                        var midX  = lerp(FN3_PIVOT_X, landingX, riseDuration / totalDuration);
                        var peakY = FN3_PIVOT_Y - riseAmount;

                        function fall() {
                            animate(fallDuration, function(t) {
                                ball.style.left = lerp(midX, landingX, t) + '%';
                                ball.style.top  = lerp(peakY, BALL_LANDING_Y, t * t) + '%';
                            }, revealNext);
                        }

                        if (riseDuration > 0) {
                            // Phase 1: rise (ease-out -- decelerating, like gravity slowing an ascent).
                            animate(riseDuration, function(t) {
                                ball.style.left = lerp(FN3_PIVOT_X, midX, t) + '%';
                                ball.style.top  = lerp(FN3_PIVOT_Y, peakY, t * (2 - t)) + '%';
                            }, fall);
                        } else {
                            // angle ~= 0: no rise, identical to the original half-parabola.
                            fall();
                        }
                    });
                }, 400);
            },
            on_finish: function() { stopAllAudio(); }
        };
    }


    // ================================================================
    // PRELOAD
    // continue_after_error keeps the study running even if a filename below
    // doesn't match what's actually in assets/ (broken-image placeholder /
    // silent audio instead of a hard stop).
    // ================================================================
    // Function 3 (quadratic) uses a completely different asset set for

    var preload = (fnNum === 3) ? {

        ],

            'assets/audio/Audio_10.m4a',

        ],
        video: [

        ],
