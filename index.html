        continue_after_error: true
    };
    timeline.push(preload);


    // ================================================================
    // INTRO
    // ================================================================
    var intro = {
        type: jsPsychHtmlButtonResponse,
        stimulus: stageHtml('assets/images/main.jpeg'),
        choices: ['next'],
        button_html: nextBtnHtml,
        data: { task: 'intro' },
        on_load: function() {
            window.bgMusic = new Audio('assets/audio/background2.mp3');
            window.bgMusic.loop   = true;
            window.bgMusic.volume = 0.4;
            window.bgMusic.play().catch(function() {});
            anchorBtnGroupInStage();
            addBtnSound();
        },
        on_finish: function() {
            stopAllAudio();
            if (window.bgMusic) { window.bgMusic.pause(); window.bgMusic = null; }
        }
    };
    timeline.push(intro);


    var FN = FUNCTIONS[fnNum];
    if (!FN) { console.error('No function definition for fnNum=' + fnNum); return; }

    // Function 3 (quadratic) uses an entirely different familiarization /
    // training / testing story -- a rotating slingshot instead of a sliding
    // one -- while intro, ending, and data-save stay identical either way
    // (see below). Functions 1/2/4 keep the original apple-catching flow.
    if (fnNum === 3) {

        // ============================================================
        // CFL2-QUADRATIC FAMILIARIZATION PHASE (rotating slingshot story)
        // ============================================================
        var TRAINING_BG_FN3 = 'assets/images/Training_bg_fn3.jpeg';

        timeline.push(buildVideoTrial('assets/videos/CFL2_intro1.mp4', 'fam_1', 14.4));
        timeline.push(buildAudioGatedTrial({
            background: 'assets/images/Intro_5.jpeg', audio: 'assets/audio/Audio_1.m4a', task: 'fam_2',
            autoAdvance: true
        }));
        timeline.push(buildRotatingDragTrial({
            background: 'assets/images/Intro_6.jpeg', task: 'fam_3', startAngle: FAM3_START_ANGLE
        }));
        timeline.push(buildVideoTrial('assets/videos/CFL2_intro6_7.mp4', 'fam_4', 21.0));
        timeline.push(buildAudioGatedTrial({
            background: 'assets/images/Intro_7.jpeg', audio: 'assets/audio/Audio_12.m4a', task: 'fam_5'
        }));
        timeline.push(buildAudioGatedTrial({
            background: 'assets/images/Intro_8.jpeg', audio: 'assets/audio/Audio_13.m4a', task: 'fam_6'
        }));
        timeline.push(buildRotatingDragTrial({
            background: 'assets/images/Intro_9.jpeg', task: 'fam_7', startAngle: FAM7_START_ANGLE
        }));
        timeline.push(buildVideoTrial('assets/videos/CFL2_intro8_9.mp4', 'fam_8', 28.7));
        timeline.push(buildAudioGatedTrial({
            background: 'assets/images/Intro_10.jpeg', audio: 'assets/audio/Audio_13.m4a', task: 'fam_9'
        }));
        timeline.push(buildRotatingDragTrial({
            background: 'assets/images/Intro_11.jpeg', task: 'fam_10', startAngle: FAM10_START_ANGLE
        }));
        timeline.push(buildVideoTrial('assets/videos/CFL2_intro10_11.mp4', 'fam_11', 20.0));

        timeline.push(buildAudioGatedTrial({
            background: 'assets/images/Transition_bg_fn3.jpeg', audio: 'assets/audio/Audio_3.m4a', task: 'transition_1'
        }));


        // ============================================================
        // CFL2-QUADRATIC TRAINING PHASE
        // ============================================================
        for (var i3 = 0; i3 < FN.training.inputs.length; i3++) {
            var isFirst3 = (i3 === 0);
            timeline.push(buildFn3PlacementTrial({
                input_value: FN.training.inputs[i3],
                true_output: FN.training.outputs[i3],
                trial_index: i3 + 1,
                task:        'training_response',
                place_audio: isFirst3 ? 'assets/audio/Audio_14.m4a' : 'assets/audio/Audio_18.m4a'
            }));
            timeline.push(buildFn3LandingFeedbackTrial({
                input_value:  FN.training.inputs[i3],
                true_output:  FN.training.outputs[i3],
                trial_index:  i3 + 1,
                landed_audio: isFirst3 ? 'assets/audio/Audio_15.m4a' : 'assets/audio/Audio_7.mp3'
            }));

            // Same 3-block schedule as the original flow (see the comment
            // there for why there's no "before block 4"), with fn3's own
            // checkpoint narration.
            if (i3 + 1 === 6) {
                timeline.push(buildAudioGatedTrial({
                    background: TRAINING_BG_FN3, audio: 'assets/audio/Audio_16.m4a', task: 'before_block_2'
                }));
            } else if (i3 + 1 === 12) {
                timeline.push(buildAudioGatedTrial({
                    background: TRAINING_BG_FN3, audio: 'assets/audio/Audio_17.m4a', task: 'before_block_3'
                }));
            }
        }


        // ============================================================
        // CFL2-QUADRATIC TESTING PHASE
        // ============================================================
        timeline.push(buildAudioGatedTrial({
            background: TRAINING_BG_FN3, audio: 'assets/audio/Audio_11.mp3', task: 'transition_2'
        }));

        var testIndices3 = FN.testing.inputs.map(function(_, i) { return i; });
        for (var k3 = testIndices3.length - 1; k3 > 0; k3--) {
            var r3 = Math.floor(Math.random() * (k3 + 1));
            var tmp3 = testIndices3[k3]; testIndices3[k3] = testIndices3[r3]; testIndices3[r3] = tmp3;
        }

        for (var j3 = 0; j3 < testIndices3.length; j3++) {
            var ci3 = testIndices3[j3];
            timeline.push(buildFn3PlacementTrial({
                input_value:     FN.testing.inputs[ci3],
                true_output:     FN.testing.outputs[ci3],
                trial_index:     j3 + 1,
                canonical_index: ci3 + 1,
                task:            'testing',
                place_audio:     'assets/audio/Audio_18.m4a'
            }));
        }

    } else {

        // ============================================================
        // FAMILIARIZATION PHASE (apple-catching story) -- functions 1/2/4
        // ============================================================
        var TRAINING_BG = 'assets/images/Training_bg.jpeg';

        timeline.push(buildVideoTrial('assets/videos/CFL2_intro1.mp4', 'fam_1', 14.4));
        timeline.push(buildAudioGatedTrial({
            background: 'assets/images/Intro_1.jpeg', audio: 'assets/audio/Audio_1.m4a', task: 'fam_2',
            autoAdvance: true
        }));
        timeline.push(buildAppleDragTrial({ background: 'assets/images/Intro_2.jpeg', task: 'fam_3' }));
        // Fam_4 replaces the old Fam_4/5/6 (miss video, second apple drag, catch
        // video) with a single combined clip showing both outcomes; there's now
        // only one apple-drag attempt per background instead of two.
        timeline.push(buildVideoTrial('assets/videos/CFL2_intro2_3.mp4', 'fam_4', 21.0));
        timeline.push(buildAudioGatedTrial({
            background: 'assets/images/Intro_3.jpeg', audio: 'assets/audio/Audio_2.m4a', task: 'fam_7',
            autoAdvance: true
        }));
        timeline.push(buildAppleDragTrial({ background: 'assets/images/Intro_4.jpeg', task: 'fam_8' }));
        // Fam_9 replaces the old Fam_9/10/11 (miss video, second apple drag,
        // catch video) the same way.
        timeline.push(buildVideoTrial('assets/videos/CFL2_intro4_5.mp4', 'fam_9', 22.8));

        timeline.push(buildAudioGatedTrial({
            background: 'assets/images/Transition_bg.jpeg', audio: 'assets/audio/Audio_3.m4a', task: 'transition_1'
        }));


        // ============================================================
        // TRAINING PHASE
        // ============================================================
        for (var i = 0; i < FN.training.inputs.length; i++) {
            var isFirst = (i === 0);
            timeline.push(buildPlacementTrial({
                input_value: FN.training.inputs[i],
                true_output: FN.training.outputs[i],
                trial_index: i + 1,
                task:        'training_response',
                place_audio: isFirst ? 'assets/audio/Audio_4.m4a' : 'assets/audio/Audio_6.mp3'
            }));
            timeline.push(buildLandingFeedbackTrial({
                input_value:  FN.training.inputs[i],
                true_output:  FN.training.outputs[i],
                trial_index:  i + 1,
                landed_audio: isFirst ? 'assets/audio/Audio_5.m4a' : 'assets/audio/Audio_7.mp3'
            }));

            // "Before block 2/3" checkpoints after the 6th/12th training trial.
            // Only 3 training blocks now (18 trials total, see config/functions.js),
            // so there's no "before block 4" checkpoint. Audio_9 ("let's start over
            // and do this one more time") was written for a middle transition that
            // no longer exists -- skipped. The trial-12 checkpoint, now the LAST
            // block transition, uses Audio_10 ("let's do this for the last time")
            // instead, since that's the one that semantically fits.
            if (i + 1 === 6) {
                timeline.push(buildAudioGatedTrial({
                    background: TRAINING_BG, audio: 'assets/audio/Audio_8.m4a', task: 'before_block_2'
                }));
            } else if (i + 1 === 12) {
                timeline.push(buildAudioGatedTrial({
                    background: TRAINING_BG, audio: 'assets/audio/Audio_10.m4a', task: 'before_block_3'
                }));
            }
        }


        // ============================================================
        // TESTING PHASE
        // ============================================================
        timeline.push(buildAudioGatedTrial({
            background: TRAINING_BG, audio: 'assets/audio/Audio_11.mp3', task: 'transition_2'
        }));

        // Shuffle test trial order — Fisher-Yates, fresh random permutation per participant.
        // canonical_index records which item from functions.js was shown (1-based),
        // trial_index records the presentation position (1-based).
        var testIndices = FN.testing.inputs.map(function(_, i) { return i; });
        for (var k = testIndices.length - 1; k > 0; k--) {
            var r = Math.floor(Math.random() * (k + 1));
            var tmp = testIndices[k]; testIndices[k] = testIndices[r]; testIndices[r] = tmp;
        }

        for (var j = 0; j < testIndices.length; j++) {
            var ci = testIndices[j];
            // Testing trials use the same placement UI as training's response half,
            // but there is no companion feedback trial: OK locks the duck and the
            // trial ends immediately with no ball flight and no reveal of true_output.
            timeline.push(buildPlacementTrial({
                input_value:     FN.testing.inputs[ci],
                true_output:     FN.testing.outputs[ci],
                trial_index:     j + 1,
                canonical_index: ci + 1,
                task:            'testing',
                place_audio:     'assets/audio/Audio_6.mp3'
            }));
        }
    }


    // ================================================================
    // ENDING
    // ================================================================
    timeline.push(buildVideoTrial('assets/videos/CFL2_end.mp4', 'end', 15.4));

    // ---- Data save ----
    // 1) OSF upload via DataPipe (uploadToDataPipe, top of the script):
    //    uncompressed, one retry, hard 20 s limit -- the study ALWAYS moves on
    //    to the ending page, and the result is recorded in the data
    //    (task 'save_upload': upload_ok / upload_status / upload_message).
    // 2) Ending page: shows whether OSF worked and has an experimenter-tapped
    //    "Save data file" button for the local CSV (iPad Safari only allows
    //    downloads reliably from a tap), plus "Retry OSF upload" on failure.
    // 3) Until OSF succeeds, the session stays backed up in this browser's
    //    localStorage and appears on the startup form for recovery.
    window._uploadResult = null;

    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: '<div style="padding:60px;text-align:center;font-size:28px;">Saving your data…</div>',
        choices: [],
        data: { task: 'save_upload' },
        on_load: function() {
            jsPsych.data.addProperties({
                study_completion_timestamp: new Date().toISOString(),
                js_errors: window._jsErrors.length ? window._jsErrors.join(' | ') : null
            });
            writeSessionBackup(true);

            var finished = false;
            function finish(result) {
                if (finished) return;
                finished = true;
                window._uploadResult = result;
                if (result.ok) {
                    window._session.uploaded = true;
                    clearSessionBackup(subject_id);
                }
                jsPsych.finishTrial({
                    upload_ok: result.ok, upload_status: result.status,
                    upload_message: result.message || null, upload_attempts: result.attempts || null
                });
            }
            uploadToDataPipe(filename, rowsToCsv(sessionRows())).then(finish, function(e) {
                finish({ ok: false, status: 'script_error', message: (e && e.message) || String(e), attempts: 0 });
            });
            // Belt and braces: never wait longer than the limit + 2 s.
            setTimeout(function() {
                finish({ ok: false, status: 'timeout', message: 'Gave up waiting for DataPipe', attempts: null });
            }, UPLOAD_TIME_LIMIT_MS + 2000);
        }
    });

    // Ending page. No choices: it stays up until the page is reloaded for the
    // next child, so the experimenter always gets a chance to tap Save.
    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: function() {
            var btn = 'display:block; width:100%; padding:20px; font-size:24px; font-weight:bold; border:none; ' +
                      'border-radius:10px; margin-top:16px; cursor:pointer; color:white;';
            return '<div style="max-width:min(700px, 92vw); margin:60px auto; text-align:center; ' +
                        'font-family:-apple-system,sans-serif;">' +
                    '<div style="font-size:34px; font-weight:bold; margin-bottom:24px;">✓ Session complete!</div>' +
                    '<div id="osf-status" style="font-size:22px; margin-bottom:8px;"></div>' +
                    '<div style="font-size:16px; color:#666;">Experimenter: tap Save data file and confirm the download before reloading.</div>' +
                    '<button id="save-csv-btn" style="' + btn + 'background:#2980b9;">Save data file</button>' +
                    '<div id="save-csv-status" style="font-size:17px; color:#555; margin-top:10px;"></div>' +
                    '<button id="retry-osf-btn" style="' + btn + 'background:#27ae60; display:none;">Retry OSF upload</button>' +
                '</div>';
        },
        choices: [],
        data: { task: 'ending_page' },
        on_load: function() {
            var osfStatus = document.getElementById('osf-status');
            var retryBtn  = document.getElementById('retry-osf-btn');

            function showUploadResult(r) {
                if (r && r.ok) {
                    osfStatus.innerHTML = '<span style="color:#27ae60;">Uploaded to OSF ✓</span>' +
                        (r.status === 'queued' ? '<br><span style="font-size:16px;color:#666;">(DataPipe received it and will finish the OSF upload)</span>' : '');
                    retryBtn.style.display = 'none';
                } else {
                    osfStatus.innerHTML = '<span style="color:#c0392b;">OSF upload failed: ' +
                        ((r && r.status) || 'unknown') + '</span>' +
                        (r && r.message ? '<br><span style="font-size:16px;color:#666;">' +
                            String(r.message).replace(/[<>&]/g, '') + '</span>' : '') +
                        '<br><span style="font-size:16px;color:#666;">Save the data file below. The data also stays on this device until it reaches OSF.</span>';
                    retryBtn.style.display = 'block';
                }
            }
            showUploadResult(window._uploadResult);

            document.getElementById('save-csv-btn').addEventListener('click', function() {
                downloadCSV(sessionRows(), filename);
                document.getElementById('save-csv-status').textContent =
                    'Download started: ' + filename + '. On iPad, tap Download if asked, then check Files › Downloads.';
            });

            retryBtn.addEventListener('click', function() {
                retryBtn.disabled = true;
                retryBtn.textContent = 'Uploading…';
                uploadToDataPipe(filename, rowsToCsv(sessionRows())).then(function(r) {
                    retryBtn.disabled = false;
                    retryBtn.textContent = 'Retry OSF upload';
                    window._uploadResult = r;
                    if (r.ok) {
                        window._session.uploaded = true;
                        clearSessionBackup(subject_id);
                    }
                    showUploadResult(r);
                });
            });
        }
    });


    jsPsych.run(timeline);
}


</script>
</html>
